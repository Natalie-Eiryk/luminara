<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Public-safe Lab Exam II TeachingModuleV2 diagnostics." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2321475f'/%3E%3Cpath d='M4 10.5 8 3l4 7.5H4z' fill='%23f4d35e'/%3E%3C/svg%3E" />
  <title>Lab Exam II Diagnostics | TeachingModuleV2</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .diagnostics-shell { max-width: 1180px; margin: 0 auto; padding: 32px 20px; }
    .diagnostics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 24px 0; }
    .diagnostic-card { padding: 18px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--surface-1); }
    .diagnostic-card strong { display: block; font-size: 1.8rem; margin-top: 8px; }
    .diagnostic-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .diagnostic-table th, .diagnostic-table td { padding: 10px; border-bottom: 1px solid var(--border-soft); text-align: left; }
    .diagnostic-ok { color: var(--success); }
    .diagnostic-warn { color: var(--warning); }
    pre { overflow: auto; padding: 16px; border-radius: 8px; background: var(--surface-2); }
  </style>
</head>
<body>
  <main class="diagnostics-shell">
    <section class="surface hero-panel">
      <div class="hero-copy-block">
        <p class="eyebrow">TeachingModuleV2</p>
        <h1>Lab Exam II diagnostics</h1>
        <p>Public-safe content health, route, and coverage checks. Learner progress, notes, and private Lumi memory are not included.</p>
      </div>
      <div class="hero-actions">
        <a class="pill-action" href="./">Back to study</a>
        <a class="pill-action" href="./?v2=1">Open v2 preview</a>
      </div>
    </section>

    <section class="diagnostics-grid" id="diagnosticCards"></section>
    <section class="surface">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Coverage</p>
          <h2>By kind and system</h2>
        </div>
      </div>
      <div id="diagnosticTables"></div>
    </section>
    <section class="surface">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Raw public report</p>
          <h2>Diagnostics JSON</h2>
        </div>
      </div>
      <pre id="diagnosticsJson">Loading...</pre>
    </section>
  </main>

  <script src="../820.31-v2/teaching-module-v2.js"></script>
  <script src="study_data_core.js"></script>
  <script src="study_questions.js"></script>
  <script src="study_glossary_1.js"></script>
  <script src="study_glossary_2.js"></script>
  <script src="study_exam_guide_roll.js"></script>
  <script src="study_atlas_respiratory.js"></script>
  <script src="study_atlas_digestive.js"></script>
  <script src="study_atlas_urinary.js"></script>
  <script src="study_atlas_endocrine.js"></script>
  <script src="study_atlas_reproductive.js"></script>
  <script src="study_atlas_fetal_pig.js"></script>
  <script src="study_atlas_histology.js"></script>
  <script src="study_support.js"></script>
  <script src="study_generated_questions.js"></script>
  <script src="v2-bridge.js"></script>
  <script src="diagnostics.js"></script>
</body>
</html>
